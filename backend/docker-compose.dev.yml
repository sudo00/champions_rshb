services:
  app:
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
      - app_nuxt:/app/.nuxt
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
      WATCHPACK_POLLING: "true"

  worker:
    volumes:
      - ./worker:/app
    command: ["watchfiles", "--filter", "python", "python main.py", "."]
