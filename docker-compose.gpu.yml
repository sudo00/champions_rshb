# Recognition runtime; combine with docker-compose.yml and optionally docker-compose.dev.yml.
services:
  api:
    environment:
      WINE_CATALOG_PATH: /app/catalog/catalog.jsonl
      WINE_CATALOG_IMAGES: /catalog-images
    volumes:
      - ./data/deployment/catalog-images/images:/catalog-images:ro
  worker:
    build:
      dockerfile: ./build_env/worker/Dockerfile.gpu
    environment:
      WINE_BUNDLE_DIR: /models
      WINE_OCR_PYTHON: /opt/ocr/bin/python
      WINE_DEVICE: cuda:0
      WINE_OCR_DEVICE: gpu:0
    volumes:
      - ./data/deployment/wine-recognizer-v4-memory-release:/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
